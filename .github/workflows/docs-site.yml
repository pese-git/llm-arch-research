# Сборка сайта из docs/ (site/, Astro + Starlight) и публикация на GitHub Pages.
# Нужно один раз включить Pages: Settings → Pages → Source: GitHub Actions.
name: Docs site

on:
  push:
    branches: [master]
    paths: ['docs/**', 'site/**', '.github/workflows/docs-site.yml']
  pull_request:
    paths: ['docs/**', 'site/**', '.github/workflows/docs-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
