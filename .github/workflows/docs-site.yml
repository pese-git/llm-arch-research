# Проверка сборки сайта из docs/ (site/, Astro + Starlight). Сайт публикуется Docker-образом
# на кластере — см. раздел «Docker» в site/README.md.
name: Docs site

on:
  push:
    branches: [master]
    paths: ['docs/**', 'site/**', '.github/workflows/docs-site.yml']
  pull_request:
    paths: ['docs/**', 'site/**', '.github/workflows/docs-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
