server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Относительный Location при редиректе /guide → /guide/: за прокси адрес контейнера не нужен
    absolute_redirect off;

    # Страницы — папки с index.html (trailingSlash: 'always'); /guide → /guide/
    location / {
        try_files $uri $uri/ =404;
    }

    # Файлы в _astro/ с хэшем в имени: их можно кэшировать навсегда
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;
    gzip_min_length 1024;
}
