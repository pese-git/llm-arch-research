server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Относительный Location при редиректе /guide → /guide/: за прокси адрес контейнера не нужен
    absolute_redirect off;

    # Защитные заголовки; always — чтобы они были и на 404. HSTS ставит ingress.
    # add_header в location отменяет заголовки server, поэтому в каждой location они повторены
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Страницы — папки с index.html (trailingSlash: 'always'); /guide → /guide/.
    # HTML не кэшируется без проверки: браузер сверяет ETag и получает 304, если страница
    # не менялась. Иначе после выкатки он мог бы показывать старый HTML со ссылками на
    # файлы _astro/, которых в новом образе уже нет
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Файлы в _astro/ с хэшем в имени: их можно кэшировать навсегда. Один Cache-Control
    # вместо expires + add_header, которые давали два заголовка
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;
    gzip_min_length 1024;
}
