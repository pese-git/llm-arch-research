<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Архитектуры LLM">
  <!-- Стопка блоков декодера (цвета схем пособия: attention, FFN, RoPE) -->
  <rect x="14" y="16" width="100" height="22" rx="7" fill="#6c8ebf"/>
  <rect x="14" y="44" width="100" height="22" rx="7" fill="#9673a6"/>
  <rect x="14" y="72" width="100" height="22" rx="7" fill="#3a9e8f"/>
  <!-- Causal-внимание: последний токен смотрит на все предыдущие -->
  <g fill="none" stroke="#d6b656" stroke-width="3.5" stroke-linecap="round">
    <path d="M100 106 C92 128 36 128 28 106"/>
    <path d="M100 106 C94 121 58 121 52 106"/>
    <path d="M100 106 C97 115 79 115 76 106"/>
  </g>
  <g fill="#d6b656">
    <circle cx="28" cy="106" r="6"/>
    <circle cx="52" cy="106" r="6"/>
    <circle cx="76" cy="106" r="6"/>
    <circle cx="100" cy="106" r="7.5"/>
  </g>
  <!-- Токены внутри блоков -->
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="28" cy="27" r="3.5"/><circle cx="52" cy="27" r="3.5"/><circle cx="76" cy="27" r="3.5"/><circle cx="100" cy="27" r="3.5"/>
    <circle cx="28" cy="55" r="3.5"/><circle cx="52" cy="55" r="3.5"/><circle cx="76" cy="55" r="3.5"/><circle cx="100" cy="55" r="3.5"/>
    <circle cx="28" cy="83" r="3.5"/><circle cx="52" cy="83" r="3.5"/><circle cx="76" cy="83" r="3.5"/><circle cx="100" cy="83" r="3.5"/>
  </g>
</svg>
